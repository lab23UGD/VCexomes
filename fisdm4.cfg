# =====================================================================
# VCexomes | configuration file
# Run: FISDM4 whole-exome sequencing (2,198 samples, GRCh38 + decoy)
# =====================================================================
# This file is a snapshot of the parameters and paths used for the FISDM4
# analysis. Every step script sources it, so a full re-run only requires
# editing this file. Placeholders marked TODO were not recorded in the
# original scripts and must be filled in before re-running.

# ---------------------------------------------------------------------
# Project layout
# ---------------------------------------------------------------------
project="fisdm4"
workspace="/home/ceromova/PhD_Celeste/DATABASES/DATA/exomes/VCexomes/exomes_2023/fisdm4"
data_dir="${workspace}/fisdm4_data"          # one sub-directory per sample
required_files="${workspace}/required_files" # capture panel BED and interval lists
fof_dir="${workspace}/fof"                   # file-of-files lists
log_dir="${workspace}/logs"                  # SLURM logs, created by the launcher
joint_dir="${workspace}/joint_genotyping"    # cohort-level gVCF and VCF files

raw_fastq_dir="TODO"                         # root of the raw FASTQ deliveries used to build raw_fastq.fof

# ---------------------------------------------------------------------
# Reference data
# ---------------------------------------------------------------------
ref="/home/ceromova/PhD_Celeste/DATABASES/referencegenome/hsapiens/GRCh38/ReferenceGenomeDecoy/Homo_sapiens_assembly38.fasta"
gatk_bundle="/home/ceromova/PhD_Celeste/DATABASES/gatk_bundle"

# Capture panel (IDT xGen Exome Hybridisation Panel v2)
target_bed="${required_files}/xgen-exome-hyb-panel-v2-targets-hg38-edit.bed"
target_bed_chr="${required_files}/xgen-exome-hyb-panel-v2-targets-hg38-edit-chr2.bed"
bait_intervals="${required_files}/xgen-exome-hyb-panel-v2-probes-hg38-edit_chr2.interval_list"
target_intervals="${required_files}/xgen-exome-hyb-panel-v2-targets-hg38-edit-chr2.interval_list"

# Known-sites resources
mills="${gatk_bundle}/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"
dbsnp_bqsr="${gatk_bundle}/chr/dbsnp_146.hg38.vcf.gz"   # chr-prefixed copy, used in step 07
dbsnp_vqsr="${gatk_bundle}/dbsnp_146.hg38.vcf.gz"       # copy used in step 11 (see docs/CHANGES.md)
hapmap="${gatk_bundle}/hapmap_3.3.hg38.vcf.gz"
omni="${gatk_bundle}/1000G_omni2.5.hg38.vcf.gz"
kg_snps="${gatk_bundle}/1000G_phase1.snps.high_confidence.hg38.vcf.gz"

# ---------------------------------------------------------------------
# Software
# ---------------------------------------------------------------------
# Modules loaded on the cluster before each step
modules_biotools="biotools"
modules_gatk="gatk"
modules_r="R"
modules_singularity="singularity"

picard_jar="TODO"                            # was inherited from the environment as $picard
trim_galore_bin="${workspace}/software/TrimGalore/trim_galore"
vep_sif="/home/ceromova/software/ensembl-vep/docker/ensembl-vep_latest.sif"
vep_cache="/home/ceromova/vep_data"
java_mem="4g"                                # -Xmx for per-sample Picard and GATK calls
java_mem_joint="100g"                        # -Xmx for the cohort-level GATK calls

# ---------------------------------------------------------------------
# Analysis parameters
# ---------------------------------------------------------------------
trim_quality=20                              # Phred threshold (Trim Galore)
trim_length=80                               # minimum read length after trimming
min_mean_coverage=20                         # coverage cut-off applied before joint genotyping
snp_ts_filter=99.0                           # truth-sensitivity level, SNP ApplyVQSR
indel_ts_filter=99.0                         # truth-sensitivity level, INDEL ApplyVQSR
indel_max_gaussians=4
cohort_prefix="VCexomes_raw_allSamples"

# ---------------------------------------------------------------------
# Metadata and file lists
# ---------------------------------------------------------------------
manifest_file="${required_files}/manifest.tsv"           # 20-column TSV, one row per sequencing run
raw_fastq_fof="${fof_dir}/raw_fastq.fof"                 # R1 FASTQ files (17,494 entries)
samples_fof="${fof_dir}/samples.fof"                     # sample identifiers (2,198 entries)
bam_raw_fof="${fof_dir}/bam_raw.fof"                     # step 03 output
bam_merged_fof="${fof_dir}/bam_merged.fof"               # step 05 output
bam_rmdp_fof="${fof_dir}/bam_rgmod_merged_sort_rmdp.fof" # step 06 output
bam_bqsr_fof="${fof_dir}/bam_rgmod_merged_sort_rmdp_BQSR.fof" # step 07 output (2,187 entries)
gvcf_fof="${fof_dir}/gvcf_more_20x_cov.fof"              # step 08 output, coverage filtered
shard_list="${required_files}/combine_shards.txt"        # 24 primary contigs plus the literal 'decoy'
decoy_contig_list="${required_files}/chr_decoy_list.txt" # contigs grouped into the 'decoy' shard

# ---------------------------------------------------------------------
# SLURM
# ---------------------------------------------------------------------
max_concurrent=100                           # array throttle (%N), keep the queue polite

# ---------------------------------------------------------------------
# Step execution flags
# ---------------------------------------------------------------------
# The FOF of a step is produced by the previous one, so the pipeline is meant
# to be launched in blocks: 01-03, then 04-08, then 09-12, regenerating the
# lists with src/make_fof.sh in between.
STEP01=False   # Sequence QC and trimming (FastQC, Trim Galore)
STEP02=False   # MultiQC aggregation
STEP03=False   # Alignment and on-target coverage (bwa-mem2, samtools)
STEP04=False   # Read groups (Picard AddOrReplaceReadGroups)
STEP05=False   # Merge per-lane BAM files (Picard MergeSamFiles)
STEP06=False   # Sort and remove PCR duplicates (Picard SortSam, MarkDuplicates)
STEP07=False   # Base quality score recalibration (GATK BQSR)
STEP08=False   # Per-sample variant calling (GATK HaplotypeCaller, gVCF)
STEP09=False   # Combine gVCFs per shard (GATK CombineGVCFs)
STEP10=False   # Joint genotyping (GATK GenotypeGVCFs)
STEP11=False   # Variant recalibration (GATK VariantRecalibrator, ApplyVQSR)
STEP12=True    # Functional annotation (Ensembl VEP)
